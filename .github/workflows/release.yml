name: Release APK

on:
  push:
    tags:
      - "v*"
      - "V*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v1.1)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RADIOPULT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "RADIOPULT_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::error::RADIOPULT_KEYSTORE_BASE64 is not set. Without a fixed signing key every release gets a new key and cannot be installed over the previous one. See README, section Releases."
            exit 1
          fi

      - name: Build release APK
        env:
          RADIOPULT_KEYSTORE_PASSWORD: ${{ secrets.RADIOPULT_KEYSTORE_PASSWORD }}
          RADIOPULT_KEY_ALIAS: ${{ secrets.RADIOPULT_KEY_ALIAS }}
          RADIOPULT_KEY_PASSWORD: ${{ secrets.RADIOPULT_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PversionName="${TAG#[vV]}" \
            -PversionCode="${{ github.run_number }}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/RadioPult-${TAG}.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: RadioPult ${{ env.TAG }}
          generate_release_notes: true
          files: dist/RadioPult-${{ env.TAG }}.apk
